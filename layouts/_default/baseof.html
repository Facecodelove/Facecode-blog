<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <style>
    body{max-width:720px;margin:48px auto;padding:0 18px;font:16px/1.75 -apple-system,"Segoe UI",system-ui,sans-serif;color:#1f2328}
    a{color:#0b5fff;text-decoration:none}a:hover{text-decoration:underline}
    header.site{margin-bottom:36px;font-weight:600;font-size:18px}
    .meta{color:#6a737d;font-size:14px}
    ul.tags{list-style:none;padding:0;margin:8px 0 24px}
    ul.tags li{display:inline-block;margin:0 6px 6px 0;background:#f2f4f8;border-radius:4px;padding:2px 8px;font-size:13px}
    pre{background:#f6f8fa;padding:14px;border-radius:6px;overflow:auto}
    code{font-family:ui-monospace,Consolas,monospace}
    footer.site{margin-top:56px;padding-top:16px;border-top:1px solid #eaecef;color:#6a737d;font-size:14px}
  </style>
</head>
<body>
  <header class="site"><a href="{{ "/" | relURL }}">{{ .Site.Title }}</a></header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer class="site">© {{ now.Format "2006" }} {{ .Site.Params.author }}</footer>
</body>
</html>
